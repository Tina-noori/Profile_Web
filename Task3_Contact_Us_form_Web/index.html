<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacte</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contacte-form"> 
        <h2>Contact Us</h2>
        <form>
        <div class="name-row">
            <div class="input-group">
                <label for="first-name">First Name:</label>
                <input type="text" id="first-name" name="first_name" placeholder="Enter your first name" required>
            </div>
            <div class="input-group">
                <label for="last">Last Name:</label>
                <input type="text" id="last" name="last_name" placeholder="Enter your last name" required>
            </div>
        </div>



            <div class="input-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone_number" placeholder="Enter your phone number" required>
            </div>

            <div class="input-group">
                <label for="email">Email Address:</label>
                <input type="text" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="input-group">
                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject" placeholder="What is this about?" required>
                
            </div>
            <div class="input-group">
                <label for="message">Message:</label>
                <textarea  id="message" name="message" placeholder="Enter your message" required></textarea>
            </div>
            <button name="submit" type="submit" class="contacte-btn">Submit</button>

        </form>



    </div>
    
</body>
</html>
